name: SimplestNotes
options:
  bundleIdPrefix: app.simplestnotes
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  NotesCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SimplestNotes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/SimplestNotes
    dependencies:
      - package: NotesCore
        product: NotesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simplestnotes.SimplestNotes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Simplest Notes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Local Mac runs: let Xcode manage signing (Signing & Capabilities → your Team).
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SimplestNotesUITests

  SimplestNotesUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/SimplestNotesUITests
    dependencies:
      - target: SimplestNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.simplestnotes.SimplestNotesUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SimplestNotes
        CODE_SIGN_STYLE: Automatic
