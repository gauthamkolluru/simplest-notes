name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notescore-linux:
    name: NotesCore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift test (T0.01)
        run: swift test

  notescore-macos:
    name: NotesCore (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift test (T0.01)
        run: swift test

  app-ui-macos:
    name: App UI (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & UI test macOS (T0.02)
        run: |
          xcodebuild \
            -project SimplestNotes.xcodeproj \
            -scheme SimplestNotes \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

  app-ui-ios:
    name: App UI (iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build & UI test iPhone (T0.02)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for r in d['devices'].values() for x in r if x.get('isAvailable') and 'iPhone' in x['name']))")
          xcodebuild \
            -project SimplestNotes.xcodeproj \
            -scheme SimplestNotes \
            -destination "platform=iOS Simulator,id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            test
